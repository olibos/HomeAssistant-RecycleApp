name: Auto Label

on:
  # pull_request_target so PRs from forks can be labelled.
  # SECURITY: never check out or run PR code in this workflow
  # (it runs with a write token in the base repo context).
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
